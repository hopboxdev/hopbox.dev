<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hopbox</title>
<meta name="description" content="hopbox is being rebuilt from scratch.">
<style>
:root { color-scheme: light dark; --bg: #f6f7f5; --fg: #1a211b; --muted: #5b665d; }
@media (prefers-color-scheme: dark) { :root { --bg: #111512; --fg: #e4eae5; --muted: #9aa89c; } }
html, body { height: 100%; }
body { margin: 0; padding: 24px; box-sizing: border-box; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 17px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 34rem; }
h1 { font-size: 2rem; margin: 0 0 .5rem; letter-spacing: -.01em; }
p { margin: 0 0 .75rem; color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>hopbox</h1>
<p>hopbox is being rebuilt from scratch.</p>
<p>The previous version is retired and can no longer be installed.</p>
</main>
</body>
</html>
