<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200">
  <defs>
    <radialGradient id="body" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#7ff0ae"/><stop offset="60%" stop-color="#4fd48a"/><stop offset="100%" stop-color="#2ea86a"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cffbe4"/><stop offset="100%" stop-color="#8ff0bf"/>
    </linearGradient>
  </defs>
  <!-- the box it sits on -->
  <g>
    <rect x="46" y="150" width="128" height="34" rx="9" fill="#101a16" stroke="#8b5cff" stroke-opacity=".5"/>
    <circle cx="60" cy="167" r="3" fill="#4fd48a"/><circle cx="72" cy="167" r="3" fill="#b48bff"/>
    <rect x="86" y="164" width="74" height="6" rx="3" fill="#1c2c25"/>
  </g>
  <!-- back legs -->
  <ellipse cx="52" cy="150" rx="24" ry="16" fill="#2ea86a"/>
  <ellipse cx="168" cy="150" rx="24" ry="16" fill="#2ea86a"/>
  <!-- body -->
  <ellipse cx="110" cy="118" rx="66" ry="52" fill="url(#body)"/>
  <!-- belly -->
  <ellipse cx="110" cy="132" rx="38" ry="32" fill="url(#belly)" opacity=".9"/>
  <!-- front feet -->
  <g fill="#3ec483">
    <ellipse cx="82" cy="166" rx="17" ry="8"/><ellipse cx="138" cy="166" rx="17" ry="8"/>
    <circle cx="70" cy="166" r="4"/><circle cx="80" cy="169" r="4"/><circle cx="90" cy="166" r="4"/>
    <circle cx="130" cy="166" r="4"/><circle cx="140" cy="169" r="4"/><circle cx="150" cy="166" r="4"/>
  </g>
  <!-- eye bulges -->
  <circle cx="80" cy="60" r="28" fill="url(#body)"/>
  <circle cx="140" cy="60" r="28" fill="url(#body)"/>
  <!-- eyes -->
  <circle cx="80" cy="58" r="18" fill="#fbfff7"/>
  <circle cx="140" cy="58" r="18" fill="#fbfff7"/>
  <circle cx="84" cy="61" r="8.5" fill="#16241d"/>
  <circle cx="136" cy="61" r="8.5" fill="#16241d"/>
  <circle cx="80" cy="55" r="3" fill="#fff"/><circle cx="132" cy="55" r="3" fill="#fff"/>
  <!-- eyelids (blink) -->
  
  
  <!-- nostrils -->
  <circle cx="102" cy="92" r="2.4" fill="#1f7a4e"/><circle cx="118" cy="92" r="2.4" fill="#1f7a4e"/>
  <!-- smile -->
  <path d="M74 104 Q110 138 146 104" fill="none" stroke="#1f7a4e" stroke-width="4.5" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="70" cy="112" r="7" fill="#ff9ec4" opacity=".45"/>
  <circle cx="150" cy="112" r="7" fill="#ff9ec4" opacity=".45"/>
</svg>